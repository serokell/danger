scanners:
  markdown:
    flavor: GitHub

exclusions:
  # Notion requires authentication; xrefcheck cannot verify these links.
  ignoreExternalRefsTo:
    - "https://app.notion.com/.*"
    # TODO: remove once this repo goes public. While it's private, GitHub
    # returns 404 (not 403) for its own issues/PRs to an unauthenticated
    # request, indistinguishable from a genuinely broken link. Once public,
    # this exclusion would silently hide real broken issue/PR links instead.
    - "https://github\\.com/serokell/danger/(issues|pull)(/.*)?"
